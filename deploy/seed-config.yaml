# SEED CONFIGURATION for a deployment with deploy/docker-compose.yml. Used ONCE, as the input of
#   llm-scheduler import-config --data-dir <dir> seed-config.yaml
# which writes it into an empty configuration database as revision 1. After that the
# database is the source of truth: change settings through the REST API, MCP or the web
# UI (docs/runbook.md); editing this file changes nothing. The server never reads YAML.
# The keys listen, models_dir, data_dir, history_dir and child_log_dir are NOT imported:
# they are deployment paths set by flags or LLM_SCHEDULER_* variables (compose sets them).
# Same content as configs/example.yaml (design 6, 6.1, where every field is explained) apart
# from this header, the three deployment paths below and the measuring template at the end
# of the profiles. Before importing, change at least:
#   fleet.url        the fleet console as the container sees it (compose maps host.docker.internal to the host)
#   fleet.local_node the hostname the fleet console reports for the machine the scheduler runs on
#   tiers            hostname globs that match your nodes
#   profiles         model files that exist in the models volume
# Validate without writing:
#   docker compose run --rm --no-deps llm-scheduler import-config --check /seed/seed-config.yaml

listen: ":8080"                    # address the scheduler's HTTP API listens on (compose maps it to 3122)
fleet:
  url: http://host.docker.internal:8090   # base URL of the fleet console; empty = only the local node is used
  local_node: host-1               # the fleet name of the host the scheduler runs on
  stale_after: 60s                 # age of the fleet view beyond which remote nodes are not used
models_dir: /models                # directory that holds the model files (GGUF) named by the profiles
child_log_dir: /var/log/llm-children   # full output of every child, one file per start (compose mounts ./logs here)
# child_log_keep: 200              # most files kept in child_log_dir; the oldest are deleted
history_dir: /var/lib/llm-scheduler/history   # safety and lifecycle event history, JSON Lines, for GET /api/history and the dashboard at /ui/ (compose mounts ./history here). Empty = off
# history_max_file_mib: 16         # a history file is rotated at this size
# history_keep_files: 20           # most history files kept; the oldest are deleted
# history_memory_events: 5000      # newest events held in memory for queries (reloaded from the files at start)
data_dir: /var/lib/llm-scheduler/data   # scheduler database (scheduler.db) for benchmarks and their results (design 9.3; compose mounts ./data here). Empty = benchmark feature off
# ws_max_clients: 32               # most concurrent /ws (WebSocket) clients; the next one is refused with 503. /ws allows same-origin and private-LAN origins only

defaults:
  ttl: 300s                # unload a model after this long idle; 0 = never
  min_hold: 30s            # least time an instance is protected from being displaced (8.3)
  max_hold: 900s           # longest time an instance is protected from being displaced
  drain_after: 60s         # how long a busy model is left alone before a waiting request asks it to drain
  queue_timeout: 600s      # longest a request may wait in the queue without being given a model
  stall_timeout: 300s      # longest gap between streamed chunks once a response has begun; 0 = no check
  command_load_timeout: 900s   # load timeout for kind: command profiles
  # load_stall_timeout: 180s  # fail a load whose measured upload gets no new acknowledged bytes for this long (a hung child); 0 = off; per-profile override of the same name
  shutdown_grace: 300s     # how long a clean shutdown waits for in-flight requests before killing children
  max_pool: 4              # most nodes a single model may be split across
  device_overhead_mib: 600 # per-device memory cost added to estimated needs only
  min_share_mib: 1024      # least memory a node must be able to hold to take part in a split
  cache_ram_mib: 2048      # per-instance prompt cache limit on the host
  server_bin: llama-server-rpc   # the llama.cpp server binary started for each model
  local_device: CUDA0      # the llama.cpp device name of the local GPU
  # forced_node_grace: 30s  # a force_nodes node absent or offline this long in a live fleet view fails the request now (not after queue_timeout)
  # forced_fit_check: off   # off | warn | reject. A force_nodes profile skips the placer's fit check; with warn or reject its need is compared with the forced nodes' usable memory at pre-flight: warn logs and starts anyway, reject answers 503 "forced nodes do not fit"
  # Memory safety on shared-memory nodes (GPU memory is system RAM; a load that exhausts it can make the whole machine unreachable). The scheduler plans so a load fits and watches while it runs:
  # split_skew_margin: 0.15      # 0 to 1. A split model does not land evenly: every multi-node placement that includes a shared-memory node must fit that node's expected share, need x split fraction x (1 + this), into its usable memory
  # estimate_margin: 0.05        # 0 to 1. Added to every need that is an estimate (a profile without needs_mib): need x (1 + this). A successful load teaches the scheduler the measured size for the rest of the run
  # load_memory_floor_mib: 768   # 0 = off. While a load runs on shared-memory nodes, a node whose available memory falls below this is cancelled at once (the child is killed, waiting requests get 502)
  # Worker health (design 8.4a) is always on for every remote worker that backs an instance: upload progress and the fleet heartbeat are watched, a worker with both silent is hung and its node is quarantined. Only the TCP connect probe is optional.
  # worker_silence: 30s         # a worker's upload progress or fleet heartbeat counts as silent after this long without news
  # worker_probe_interval: 0    # DEFAULT 0 = the TCP connect probe never runs. Leave it off for rpc-server workers: an rpc-server accepts one client at a time, so repeated connect probes fill its listen backlog. Set e.g. 10s only for workers that accept parallel connections
  # worker_probe_during_inference: false  # only with the probe on: also probe while the instance has a request in flight

tiers:                     # how nodes are ranked. First match wins; a node matching no tier is never used
  - match: { hostname: "console-*" }   # case-insensitive hostname glob a node must match
    priority: 1            # lower is preferred: models go to these nodes first
    headroom_mib: 1024     # memory kept free on each node of this tier
    shared_memory: true    # the node's GPU memory is system RAM
    link_mb_s: 100         # link speed in MB/s, used to size load timeouts
    settle: 3s             # how long a node is unusable after an instance releases it
  - match: { hostname: "laptop-*" }
    priority: 2
    headroom_mib: 256      # dedicated VRAM; pre-flight gives exact figures
    link_mb_s: 60
    settle: 8s
  - match: { local: true } # true matches only the host the scheduler runs on
    priority: 3
    headroom_mib: 450      # what the driver reports minus what llama.cpp can really use
    settle: 2s

# Optional: an address that wins over the one the fleet reports (ip and rpc_port).
# Use it only to pin a node whose fleet address is missing or wrong.
# node_overrides:
#   laptop-1: { rpc: "192.0.2.3:50052" }   # hostname or node id -> rpc-server address

# Optional: nodes that are never used. Each entry is a node id (a MAC such as
# 02:00:00:00:00:01) or a hostname glob; matching ignores case. An excluded node
# gets no model, is not counted in capacity checks and is never pre-flighted, but
# it still shows in /api/status (excluded: true). The console-* tier keeps finding
# every other console. Excluding wins over force_nodes. Excluding the local node
# (host-1) means the host machine's GPU is never used.
# exclude_nodes:
#   - console-test*

# Optional: recovery requests (design 8.4b). OFF by default; nothing is ever sent unless enabled is true.
# When worker health marks a remote worker "hung", the scheduler can ask the fleet manager to relay a
# recovery request to that node; a small service on the node polls the fleet manager, acts, and reports
# the outcome (shown as nodes[].recovery in GET /api/status). The scheduler never contacts the node itself.
# WARNING: restart_docker and reboot interrupt EVERYTHING on that machine. Leave them out unless you want that.
# recovery:
#   enabled: false                 # true = send requests
#   actions: [restart_rpc_server]  # escalation order; allowed: restart_rpc_server, restart_docker, reboot (in this order, each once)
#   min_interval: 120s             # least time between two requests for one node; at least 60s
#   step_wait: 90s                 # how long a step gets to take effect before the next step is sent
#   request_ttl: 45s               # how long a request stays valid at the node; at most 60s
#   http_timeout: 3s               # timeout of the POST to the fleet manager; one retry after 10s on a 5xx or timeout

profiles:                  # what clients can ask for; the key is the model name in API requests
  qwen3-4b:
    model: Qwen3-4B-Q4_K_M.gguf   # model file name under models_dir
    ctx: 16384             # context size per slot, in tokens
    needs_mib: 3400        # measured memory need; leave it out to estimate from the model file
    aliases: [qwen-small]  # other names that resolve to this profile

  gemma-3-12b:             # a bare name is the default variant
    model: gemma-3-12b-it-Q4_K_M.gguf
    ctx: 8192
    needs_mib: 7900

  "gemma-3-12b:32k":       # a variant: same model, other settings, addressed as name:variant
    model: gemma-3-12b-it-Q4_K_M.gguf
    ctx: 32768
    kv_quant: q8_0         # key-value cache precision: f16 (default), q8_0 or q4_0; q8_0 and q4_0 need flash_attn
    flash_attn: true       # turn flash attention on
    allow_tiers: [1, 2]    # tier priorities this profile may use; empty means all
    # force_nodes: [console-1, console-2]   # node ids or hostnames, in device order, instead of automatic placement
    # tensor_split: [50, 50]                # explicit split weights, one per forced node

  # ---------------------------------------------------------------------------
  # MEASURING TEMPLATE (commented out; runbook section G). To measure a profile's
  # memory need, uncomment it, set force_nodes to nodes that are online and free,
  # import or POST it, then
  #   scripts/measure-needs.sh http://127.0.0.1:3122 gemma-measure
  # Same model, ctx, kv_quant and flash_attn as the profile you are sizing.
  # Remove it afterwards. (Not in configs/example.yaml.)
  # gemma-measure:
  #   model: gemma-3-12b-it-Q4_K_M.gguf
  #   ctx: 32768                 # the variant being sized
  #   kv_quant: q8_0
  #   flash_attn: true
  #   force_nodes: [console-1, laptop-1]   # device order = this order
  #   tensor_split: [60, 40]

# Benchmarks (design 9.3, runbook "Benchmarks"): test cases and groups of them ("suites") that the
# scheduler runs through its own HTTP API, storing every result in data_dir/scheduler.db. Seeds below are
# written to the database at every start with source "config"; items created through the REST API have
# source "api" and are never overwritten by this block. Uncomment and set data_dir above to use it.
# bench:
#   enabled: true              # default true when data_dir is set
#   regress_load_pct: 15       # a load this much slower than the baseline run's is flagged as a regression
#   regress_decode_pct: 7      # decode tokens/s this much lower than the baseline's is flagged
#   max_run_minutes: 240       # a run that takes longer is stopped and marked failed
#   benchmarks:
#     - id: qwen-cold          # a slug: letters, digits, . - _
#       name: Qwen 4B cold start
#       profile: qwen3-4b      # a profile of this file
#       cold: true             # unload first so the load is measured (default true)
#       warmup_requests: 1     # extra request after the load, recorded separately, left out of the statistics
#       repeats: 3             # each request is measured this many times
#       requests:
#         - {name: short, prompt: "Say hello in five words.", max_tokens: 32}
#         - {name: streamed, prompt: "Count from one to ten.", max_tokens: 64, stream: true}   # also measures time to first token
#     - id: gemma-cold
#       profile: gemma-3-12b
#       repeats: 3
#       requests:
#         - name: summary
#           messages:
#             - {role: system, content: "You are terse."}
#             - {role: user, content: "Explain what a load balancer does in two sentences."}
#           max_tokens: 96
#       expect: {outcome: ready, max_load_s: 120}
#     - id: both-at-once       # a concurrent step: these two loads start at the same moment
#       parallel: [qwen-cold, gemma-cold]
#   suites:
#     - id: smoke
#       name: Smoke test
#       benchmarks: [qwen-cold, gemma-cold, both-at-once]
