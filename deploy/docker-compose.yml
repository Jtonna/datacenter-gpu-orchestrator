# llm-scheduler: replaces llama-swap on the host machine (design section 10).
# Deploy to /opt/llm-scheduler (owner admin), next to the old /opt/llama-swap.
# NEVER run this and llama-swap at the same time: a worker serves one client.
name: llm-scheduler

services:
  llm-scheduler:
    image: llm-scheduler:local        # built by deploy/Dockerfile, see docs/runbook.md
    # Must stay "llama-swap": the hub finds the container by that name prefix.
    container_name: llama-swap
    restart: unless-stopped
    logging:                          # the container's own log (docker logs); child output goes to ./logs
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    init: true                        # reaps children; each child has its own process group
    stop_grace_period: 330s           # shutdown_grace (300s) + 30s, design 8.6
    ports:
      - "0.0.0.0:3122:8080"           # same binding as llama-swap today
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - models:/models:ro             # the models volume, defined at the bottom
      # Full output of every child llama-server, one file per start (the child log
      # directory, LLM_SCHEDULER_CHILD_LOG_DIR). Created on first start; old files are pruned.
      - ./logs:/var/log/llm-children
      # The event history (LLM_SCHEDULER_HISTORY_DIR): JSON Lines, rotated by size,
      # read by GET /api/history and the dashboard at /ui/. Survives image swaps.
      - ./history:/var/lib/llm-scheduler/history
      # The scheduler database (LLM_SCHEDULER_DATA_DIR): ALL configuration (profiles, tiers,
      # settings), its revisions and the audit log, plus benchmarks and runs, in scheduler.db
      # (SQLite, WAL). Back it up with the container stopped, or with sqlite3 .backup
      # (runbook "Backup and restore"). Survives image swaps. There is no config file to mount.
      - ./data:/var/lib/llm-scheduler/data
      # Used once, by `import-config`, on first install (runbook "First install and import").
      - ./seed-config.yaml:/seed/seed-config.yaml:ro
      # No /run/avahi-daemon mount: the scheduler uses IP addresses only.
    environment:
      # Central logging (CR-10): the log store below, on the compose network, behind its
      # path prefix. Remove this line to turn central logging off (runbook "Central logging").
      LLM_SCHEDULER_LOGS_STORE_URL: http://potluck-logs:9428/logs
    networks:
      - sched
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # The share: a read-only NFSv4 export of the models volume, for PS5s that read model
  # files themselves (docs/server-mode-interface.md section 7.6). No code of ours: a pinned
  # third-party image around the kernel NFS server. A separate container so that a scheduler
  # redeploy does not cut the share, and so that the scheduler runs without SYS_ADMIN.
  # Host requirement: kernel modules nfs and nfsd loaded (a file in /etc/modules-load.d/).
  llm-share:
    image: erichough/nfs-server@sha256:784ef30907aa318b8324c4c49bd258b11a740ab0eea9f09b5ccf9df378fa77ca
    container_name: llm-scheduler-share
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN                     # the minimum the kernel NFS server needs; not privileged
    security_opt:
      - apparmor=unconfined
    # POTLUCK_SHARE_BIND and POTLUCK_SHARE_NET MUST be set to the pool network of this
    # deployment (for example in an .env file next to this file): the host's address on the
    # link to the workers, and that link's subnet. The defaults are documentation addresses
    # (192.0.2.0/24) that match no real network.
    ports:
      - "${POTLUCK_SHARE_BIND:-192.0.2.1}:2049:2049/tcp"   # the pool link address only. Never 0.0.0.0.
    environment:
      NFS_EXPORT_0: "/models ${POTLUCK_SHARE_NET:-192.0.2.0/24}(ro,no_subtree_check,fsid=0,insecure,all_squash)"
      NFS_DISABLE_VERSION_3: "1"
    volumes:
      - models:/models:ro
      - /lib/modules:/lib/modules:ro
    networks:
      - sched

  # The log store of central logging (CR-10, docs/cr-10-central-logging.md): VictoriaLogs.
  # Its port is NOT published: only the scheduler reaches it, over the sched network, and
  # serves its search page read only under /logs/. Pinned by digest (the multi-platform
  # index of victoriametrics/victoria-logs:v1.54.0, read from Docker Hub on 2026-11-21).
  # Retention and the disk cap are these start flags, not Potluck settings: Potluck reads
  # them back from the store and warns in /api/status (logs.warnings) when they differ from
  # logs_retention_days and logs_max_disk_gib. Change both together, then recreate this service.
  potluck-logs:
    image: victoriametrics/victoria-logs:v1.54.0@sha256:ee4e820cac3721f5f5d91641b950c22439593adc4224f9655e5333d5a84c1dfe
    container_name: potluck-logs
    restart: unless-stopped
    command:
      - -http.pathPrefix=/logs
      - -retentionPeriod=14d
      - -retention.maxDiskSpaceUsageBytes=20GiB
      - -storageDataPath=/storage
    mem_limit: 512m
    volumes:
      # The stored log lines. Delete this folder (with the service stopped) to wipe them.
      - ./logs-store:/storage
    networks:
      - sched

volumes:
  # One volume for the model files, mounted read-only by the scheduler and by the share.
  # A bind to the existing directory: nothing is copied and llama-swap keeps reading it.
  models:
    name: llm-models
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /srv/llama-swap/models

networks:
  sched:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24       # the host firewall rule for :8090 names this subnet
