# The share's NFS server settings, mounted read only at /etc/nfs.conf in the
# potluck-share container (docker-compose.yml). It ships with the compose file.
#
# The NFSv4 grace and lease times, in seconds, at the kernel minimum. After the
# share restarts, a client's read is refused for the grace time; a Linux client
# retries with a doubling wait (at most 15 s), so it resumes at the first retry
# after the grace time ends. Measured stall of a client's read after a restart
# of the share: 93 s with the kernel defaults (90 and 90), 29.5 s with 15 and
# 15, 16.3 s with 10 and 10 (resumed without error).
[nfsd]
grace-time=10
lease-time=10
