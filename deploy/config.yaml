# Production config for the OMEN. Mount read-only at /etc/llm-scheduler/config.yaml.
# Copied from configs/example.yaml (design 6, 6.1), kept identical to it apart from this
# header and a commented measuring template appended at the end (the 2026-11-17
# hardware-test tuning is in both). Checked against the box:
#   fleet.url        host.docker.internal:8090 (compose maps it to the host)
#   local_node       omen-runner (hostname the hub reports, host/omen-hub-nodes.py)
#   node_overrides   none. The hub patch `hub-member-ip` went live on 2026-11-17 23:36 UTC
#                    and the fleet list reports 10.0.0.3:50052 for the Alienware, so the
#                    old alienware-llm override is commented out (kept as an example).
# Lines marked PLACEHOLDER / TODO measure must be replaced with measured values
# (docs/runbook.md section G) before the profile is relied on.
# Validate:  docker run --rm -v $PWD/config.yaml:/etc/llm-scheduler/config.yaml:ro \
#              -v /srv/llama-swap/models:/models:ro --entrypoint llm-scheduler \
#              llm-scheduler:local --check-config --config /etc/llm-scheduler/config.yaml

# Example llm-scheduler configuration (design sections 6 and 6.1).
# Nodes are not listed here; only how to rank them.

listen: ":8080"                    # mapped to 3122 by compose
fleet:
  url: http://host.docker.internal:8090
  local_node: omen-runner
  stale_after: 60s                 # view age beyond which remote nodes are not used
models_dir: /models
child_log_dir: /var/log/llm-children   # full output of every child, one file per start (compose mounts ./logs here)
# child_log_keep: 200              # most files kept in child_log_dir; the oldest are deleted

defaults:
  ttl: 300s                # unload after this long idle; 0 = never
  min_hold: 30s            # hold time floor (8.3)
  max_hold: 900s           # hold time ceiling
  drain_after: 60s         # wait before a busy model is asked to drain
  queue_timeout: 600s      # max time an entry may wait without a claim
  stall_timeout: 300s      # max gap between chunks once streaming has begun
  command_load_timeout: 900s   # for kind: command profiles
  shutdown_grace: 300s
  max_pool: 4
  device_overhead_mib: 600 # per-device cost added to estimated needs only
  min_share_mib: 1024      # least a node must be able to hold
  cache_ram_mib: 2048      # per-instance prompt cache limit on the host
  server_bin: llama-server-rpc
  local_device: CUDA0
  # forced_node_grace: 30s  # a force_nodes node absent or offline this long in a live fleet view fails the request now (not after queue_timeout)
  # forced_fit_check: off   # off | warn | reject. A force_nodes profile skips the placer's fit check; with warn or reject its need is compared with the forced nodes' FREE memory at pre-flight (no headroom taken off): warn logs and starts anyway, reject answers 503 "forced nodes do not fit"

tiers:                     # first match wins; lower number preferred;
                           # a node matching no tier is never used
  - match: { hostname: "ps5-*" }
    priority: 1
    headroom_mib: 1024
    shared_memory: true    # GPU memory is system RAM
    link_mb_s: 100         # used to size load timeouts. Per PS5, measured 2026-11-18 on the 2.5 GbE OMEN
                           # link (one Gemma 12B load: about 100 to 108 MB/s). Was about 80 in total and
                           # shared between loads on the old 1 GbE port (75 to 84 MB/s; two at once 167 s
                           # each, three at once 246 s each). Now two at once 66 s each, three at once 77 s
    settle: 3s
  - match: { hostname: "alienware*" }
    priority: 2
    headroom_mib: 256      # dedicated VRAM; pre-flight gives exact figures
    link_mb_s: 60          # measured 2026-11-17: 77 MB/s (qwen3.5-4b cold, 3.0 GB in 39 s)
    settle: 8s             # relayed figures are measured every 5 s
  - match: { local: true }
    priority: 3
    headroom_mib: 450      # measured 2026-11-17: nvidia-smi reports 8151 MiB but llama.cpp can use
                           # only 7707 (a 444 MiB gap); each child on the GPU also adds ~120 MiB of
                           # CUDA context that the load log does not show
    settle: 2s

# Optional: wins over the fleet's ip/rpc_port. Not needed now. The hub patch
# (hub-member-ip) went live on 2026-11-17 23:36 UTC and the fleet list reports
# 10.0.0.3:50052 for the Alienware (verified on hardware: the scheduler found it
# with no override). Uncomment only to pin a node whose fleet address is missing
# or wrong, for example against a hub without the patch.
# node_overrides:
#   alienware-llm: { rpc: "10.0.0.3:50052" }

# Optional: nodes that are never used. Each entry is a node id (a MAC such as
# 70:66:2a:a9:a7:65) or a hostname glob; matching ignores case. An excluded node
# gets no model, is not counted in capacity checks and is never pre-flighted, but
# it still shows in /api/status (excluded: true). The ps5-* tier keeps finding
# every other PS5. Excluding wins over force_nodes. Excluding the local node
# (omen-runner) means the OMEN GPU is never used.
# exclude_nodes:
#   - ps5-abc123
#   - ps5-test*

profiles:
  qwen3.5-4b:
    model: Qwen_Qwen3.5-4B-Q4_K_M.gguf
    ctx: 16384
    needs_mib: 3400        # measured 2026-11-17: 3343 MiB (load log sum) on one PS5 (.122) and on
                           # the Alienware; the GGUF estimate (4986) is 1.5x too high

  gemma-4-12b:             # bare name = the default variant
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    needs_mib: 7900        # measured 2026-11-18 (load log sum, ctx 8192): 7514 MiB on one PS5, 7831 on
                           # two, 7852 on three (2026-11-17: 7514 on the OMEN alone, +124 MiB CUDA
                           # context = 7638 in nvidia-smi); see 7.2
    aliases: [gemma-4-12b-1pool-8k, gemma-4-12b-2pool-8k]

  # Gemma is a sliding-window model: the estimate is far too high, so each
  # variant needs a measured needs_mib (design 7.2). 8K, 48k, 64k and 96k are
  # measured (2026-11-17 and 2026-11-18).
  "gemma-4-12b:48k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 49152
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 8250        # measured 2026-11-18: 8206 MiB on two PS5s (load log sum)
    aliases: [gemma-4-12b-2pool-48k]

  "gemma-4-12b:64k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 65536
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 8600        # measured 2026-11-17: 8578 MiB on Alienware + OMEN (2 devices; KV 799
                           # MiB q8_0, compute 535 + 467); one device would be about 8100
    aliases: [gemma-4-12b-2pool-64k, gemma-4-12b-3pool-64k]

  "gemma-4-12b:96k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 98304
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 9050        # measured 2026-11-18: 8998 MiB on two PS5s (load log sum)
    aliases: [gemma-4-12b-3pool-96k]

  devstral-24b:
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 8192
    needs_mib: 14300       # measured 2026-11-18: 14248 MiB on two PS5s (load log sum). Does not fit
                           # one PS5 (about 13991 needed, about 13.5 GB free)
    aliases: [devstral-24b-f16]

  "devstral-24b:14k":
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 14336
    kv_quant: q8_0
    flash_attn: true
    aliases: [devstral-24b-q8, devstral-24b-3way]

  "devstral-24b:24k":      # untested
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 24576
    kv_quant: q4_0
    flash_attn: true
    aliases: [devstral-24b-q4]

  # Laptops-only arrangement for when no PS5 is online (design 6.1).
  # The automatic placer cannot accept this (163 MiB to spare), so it is forced.
  "devstral-24b:14k-laptops":
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 14336
    kv_quant: q8_0
    flash_attn: true
    force_nodes: [alienware-llm, omen-runner]
    tensor_split: [50, 50]

  tinyllama:
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    needs_mib: 700         # measured 2026-11-17: 696 MiB on the Alienware (RPC) and on the OMEN
    aliases: [tinyllama-ps5]

  # kind: command profiles run on the local node alone. Commands are taken
  # from omen-runner-fleet-manager/apps/llama-swap/config.yaml.
  flux-1-schnell:
    kind: command
    cmd: >-
      sd-server --listen-ip 127.0.0.1 --listen-port ${PORT}
      --diffusion-model /models/flux/flux1-schnell-Q4_K_S.gguf
      --clip_l /models/flux/clip_l.safetensors
      --t5xxl /models/flux/t5-v1_1-xxl-encoder-Q4_K_S.gguf
      --vae /models/flux/ae.safetensors
      --steps 4 --cfg-scale 1.0 --sampling-method euler
    check_endpoint: /v1/models   # sd-server has no /health
    needs_mib: 7000              # PLACEHOLDER (no VRAM figure in the llama-swap README), TODO measure
    stall_timeout: 0             # image generation sends nothing until done

  flux-1-dev:
    kind: command
    cmd: >-
      sd-server --listen-ip 127.0.0.1 --listen-port ${PORT}
      --diffusion-model /models/flux-dev/flux1-dev-Q4_K_S.gguf
      --clip_l /models/flux/clip_l.safetensors
      --t5xxl /models/flux/t5-v1_1-xxl-encoder-Q4_K_S.gguf
      --vae /models/flux/ae.safetensors
      --steps 28 --cfg-scale 3.5 --sampling-method euler
    check_endpoint: /v1/models
    needs_mib: 7500              # PLACEHOLDER (no VRAM figure in the llama-swap README), TODO measure
    stall_timeout: 0

  large-v3-turbo:
    kind: command
    cmd: env -u LD_LIBRARY_PATH /opt/whisper-server/venv/bin/python /opt/whisper-server/server.py --host 127.0.0.1 --port ${PORT} --model large-v3-turbo
    check_endpoint: /health
    needs_mib: 5400              # 5.4 GB per the llama-swap README
    stall_timeout: 0             # a transcription sends nothing until it finishes

  # ---------------------------------------------------------------------------
  # MEASURING TEMPLATES (commented out; runbook section G). To measure a Gemma
  # profile, uncomment ONE, set force_nodes to nodes that are online and free,
  # restart the container (docker compose restart), then
  #   scripts/measure-needs.sh http://127.0.0.1:3122 gemma-measure
  # Same model, ctx, kv_quant and flash_attn as the profile you are sizing.
  # Re-comment it afterwards. (Not in configs/example.yaml: added for the box.)
  # gemma-measure:
  #   model: gemma-4-12b-it-Q4_K_M.gguf
  #   ctx: 65536                 # change per variant: 49152 / 65536 / 98304
  #   kv_quant: q8_0
  #   flash_attn: true
  #   force_nodes: [ps5-062e1d84, alienware-llm]   # device order = this order
  #   tensor_split: [60, 40]
