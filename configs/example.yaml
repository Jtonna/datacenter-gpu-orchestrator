# Example llm-scheduler configuration (design sections 6 and 6.1).
# Nodes are not listed here; only how to rank them.

listen: ":8080"                    # mapped to 3122 by compose
fleet:
  url: http://host.docker.internal:8090
  local_node: omen-runner
  stale_after: 60s                 # view age beyond which remote nodes are not used
models_dir: /models

defaults:
  ttl: 300s                # unload after this long idle; 0 = never
  min_hold: 30s            # hold time floor (8.3)
  max_hold: 900s           # hold time ceiling
  drain_after: 60s         # wait before a busy model is asked to drain
  queue_timeout: 600s      # max time an entry may wait without a claim
  stall_timeout: 300s      # max gap between chunks once streaming has begun
  command_load_timeout: 900s   # for kind: command profiles
  shutdown_grace: 300s
  max_pool: 4
  device_overhead_mib: 600 # per-device cost added to estimated needs only
  min_share_mib: 1024      # least a node must be able to hold
  cache_ram_mib: 2048      # per-instance prompt cache limit on the host
  server_bin: llama-server-rpc
  local_device: CUDA0

tiers:                     # first match wins; lower number preferred;
                           # a node matching no tier is never used
  - match: { hostname: "ps5-*" }
    priority: 1
    headroom_mib: 1024
    shared_memory: true    # GPU memory is system RAM
    link_mb_s: 11          # used to size load timeouts
    settle: 3s
  - match: { hostname: "alienware*" }
    priority: 2
    headroom_mib: 256      # dedicated VRAM; pre-flight gives exact figures
    link_mb_s: 11
    settle: 8s             # relayed figures are measured every 5 s
  - match: { local: true }
    priority: 3
    headroom_mib: 256
    settle: 2s

node_overrides:            # optional; wins over the fleet's ip/rpc_port
  alienware-llm: { rpc: "10.0.0.3:50052" }

profiles:
  qwen3.5-4b:
    model: Qwen_Qwen3.5-4B-Q4_K_M.gguf
    ctx: 16384

  gemma-4-12b:             # bare name = the default variant
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    needs_mib: 7800        # measured; see 7.2
    aliases: [gemma-4-12b-1pool-8k, gemma-4-12b-2pool-8k]

  # Gemma is a sliding-window model: the estimate is far too high, so each
  # variant needs a measured needs_mib (design 7.2). The values below are
  # conservative PLACEHOLDERS until measured through a force_nodes profile.
  "gemma-4-12b:48k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 49152
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 12000       # PLACEHOLDER, TODO measure (design 7.2)
    aliases: [gemma-4-12b-2pool-48k]

  "gemma-4-12b:64k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 65536
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 13000       # PLACEHOLDER, TODO measure (design 7.2)
    aliases: [gemma-4-12b-2pool-64k, gemma-4-12b-3pool-64k]

  "gemma-4-12b:96k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 98304
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 15000       # PLACEHOLDER, TODO measure (design 7.2)
    aliases: [gemma-4-12b-3pool-96k]

  devstral-24b:
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 8192
    aliases: [devstral-24b-f16]

  "devstral-24b:14k":
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 14336
    kv_quant: q8_0
    flash_attn: true
    aliases: [devstral-24b-q8, devstral-24b-3way]

  "devstral-24b:24k":      # untested
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 24576
    kv_quant: q4_0
    flash_attn: true
    aliases: [devstral-24b-q4]

  # Laptops-only arrangement for when no PS5 is online (design 6.1).
  # The automatic placer cannot accept this (163 MiB to spare), so it is forced.
  "devstral-24b:14k-laptops":
    model: Devstral-Small-2-24B-Instruct-2512-Q4_K_M.gguf
    ctx: 14336
    kv_quant: q8_0
    flash_attn: true
    force_nodes: [alienware-llm, omen-runner]
    tensor_split: [50, 50]

  tinyllama:
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    aliases: [tinyllama-ps5]

  # kind: command profiles run on the local node alone. Commands are taken
  # from omen-runner-fleet-manager/apps/llama-swap/config.yaml.
  flux-1-schnell:
    kind: command
    cmd: >-
      sd-server --listen-ip 127.0.0.1 --listen-port ${PORT}
      --diffusion-model /models/flux/flux1-schnell-Q4_K_S.gguf
      --clip_l /models/flux/clip_l.safetensors
      --t5xxl /models/flux/t5-v1_1-xxl-encoder-Q4_K_S.gguf
      --vae /models/flux/ae.safetensors
      --steps 4 --cfg-scale 1.0 --sampling-method euler
    check_endpoint: /v1/models   # sd-server has no /health
    needs_mib: 7000              # PLACEHOLDER (no VRAM figure in the llama-swap README), TODO measure
    stall_timeout: 0             # image generation sends nothing until done

  flux-1-dev:
    kind: command
    cmd: >-
      sd-server --listen-ip 127.0.0.1 --listen-port ${PORT}
      --diffusion-model /models/flux-dev/flux1-dev-Q4_K_S.gguf
      --clip_l /models/flux/clip_l.safetensors
      --t5xxl /models/flux/t5-v1_1-xxl-encoder-Q4_K_S.gguf
      --vae /models/flux/ae.safetensors
      --steps 28 --cfg-scale 3.5 --sampling-method euler
    check_endpoint: /v1/models
    needs_mib: 7500              # PLACEHOLDER (no VRAM figure in the llama-swap README), TODO measure
    stall_timeout: 0

  large-v3-turbo:
    kind: command
    cmd: env -u LD_LIBRARY_PATH /opt/whisper-server/venv/bin/python /opt/whisper-server/server.py --host 127.0.0.1 --port ${PORT} --model large-v3-turbo
    check_endpoint: /health
    needs_mib: 5400              # 5.4 GB per the llama-swap README
    stall_timeout: 0             # a transcription sends nothing until it finishes
