# Hardware test config (llm-scheduler-test, 2026-11-17). Based on deploy/config.yaml.
# Changes vs deploy/config.yaml: test-only profiles; defaults ttl 900s, min_hold 20s,
# max_hold 60s, drain_after 15s, queue_timeout 900s (lowered/raised for the eviction tests).
# v3: added Alienware/local profiles at the end.
# v2: extra_args -lv 4 on every profile (workaround, see RESULTS.md defect 1).
listen: ":8080"
fleet:
  url: http://host.docker.internal:8090
  local_node: omen-runner
  stale_after: 60s
models_dir: /models

defaults:
  ttl: 900s
  min_hold: 20s
  max_hold: 60s
  drain_after: 15s
  queue_timeout: 900s
  stall_timeout: 300s
  command_load_timeout: 900s
  shutdown_grace: 300s
  max_pool: 4
  device_overhead_mib: 600
  min_share_mib: 1024
  cache_ram_mib: 2048
  server_bin: llama-server-rpc
  local_device: CUDA0

tiers:
  - match: { hostname: "ps5-*" }
    priority: 1
    headroom_mib: 1024
    shared_memory: true
    link_mb_s: 11
    settle: 3s
  - match: { hostname: "alienware*" }
    priority: 2
    headroom_mib: 256
    link_mb_s: 11
    settle: 8s
  - match: { local: true }
    priority: 3
    headroom_mib: 256
    settle: 2s

node_overrides:
  alienware-llm: { rpc: "10.0.0.3:50052" }

profiles:
  tinyllama:
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    ttl: 120s
  qwen3.5-4b:
    model: Qwen_Qwen3.5-4B-Q4_K_M.gguf
    ctx: 16384
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
  gemma-4-12b:
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    needs_mib: 7800
  "gemma-4-12b:64k":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 65536
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    kv_quant: q8_0
    flash_attn: true
    needs_mib: 14000          # deliberately generous; replace with measured value

  # --- PS5-tier-only variants (F3 eviction) ---
  "tinyllama:t1":
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    allow_tiers: [1]
  "qwen3.5-4b:t1":
    model: Qwen_Qwen3.5-4B-Q4_K_M.gguf
    ctx: 16384
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    allow_tiers: [1]
  "gemma-4-12b:t1":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    needs_mib: 7800
    allow_tiers: [1]

  # --- forced placements (measuring / benchmarks) ---
  "tinyllama:local":
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [omen-runner]
  "gemma-4-12b:ps5a":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [ps5-9032a330]
  "gemma-4-12b:ps5b":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [ps5-31bd9dc4]
  "gemma-4-12b:2ps5":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [ps5-31bd9dc4, ps5-9032a330]
  "gemma-4-12b:2ps5-5050":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [ps5-31bd9dc4, ps5-9032a330]
    tensor_split: [50, 50]
  "gemma-4-12b:ps5-aw":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [ps5-31bd9dc4, alienware-llm]
  "gemma-4-12b:64k-ps5a":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 65536
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    kv_quant: q8_0
    flash_attn: true
    force_nodes: [ps5-9032a330]
  "gemma-4-12b:64k-ps5b":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 65536
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    kv_quant: q8_0
    flash_attn: true
    force_nodes: [ps5-31bd9dc4]

  # --- failure cases (G) ---
  "tinyllama:nonode":
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    force_nodes: [no-such-node]
  "tinyllama:huge":
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]   # WORKAROUND defect 1: buffer-size lines need verbosity 4
    needs_mib: 99999

  # --- v3 (PS5 rpc-servers went down at 16:09 after a fleet payload push): Alienware + local ---
  "tinyllama:aw":
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]
    force_nodes: [alienware-llm]
  "qwen3.5-4b:t2":
    model: Qwen_Qwen3.5-4B-Q4_K_M.gguf
    ctx: 16384
    extra_args: ["-lv", "4"]
    allow_tiers: [2]
  "tinyllama:t2":
    model: tinyllama-1.1b-chat-v1.0.Q4_K_M.gguf
    ctx: 2048
    extra_args: ["-lv", "4"]
    allow_tiers: [2]
  "gemma-4-12b:local":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]
    force_nodes: [omen-runner]
  "gemma-4-12b:aw-local":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]
    force_nodes: [alienware-llm, omen-runner]
  "gemma-4-12b:aw-local-5050":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 8192
    extra_args: ["-lv", "4"]
    force_nodes: [alienware-llm, omen-runner]
    tensor_split: [50, 50]
  "gemma-4-12b:64k-aw-local":
    model: gemma-4-12b-it-Q4_K_M.gguf
    ctx: 65536
    kv_quant: q8_0
    flash_attn: true
    extra_args: ["-lv", "4"]
    force_nodes: [alienware-llm, omen-runner]
